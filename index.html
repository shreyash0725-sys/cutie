<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For My Cutie 💕</title>
  <!-- Cute Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      color: #ff69b4;
      font-family: 'Fredoka', cursive, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    /* Page Navigation Styles */
    .page {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      transition: opacity 0.8s ease, transform 0.8s ease;
      z-index: 2;
    }

    .hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.95);
    }

    /* Typography */
    h1 {
      font-size: 3rem;
      color: #ff1493;
      text-shadow: 0 0 15px rgba(255, 20, 147, 0.8), 0 0 25px rgba(255, 105, 180, 0.6);
      margin-bottom: 15px;
      letter-spacing: 2px;
    }

    h2 {
      font-size: 1.8rem;
      color: #ff69b4;
      text-shadow: 0 0 12px rgba(255, 105, 180, 0.7);
      margin-bottom: 35px;
      line-height: 1.4;
    }

    /* Cute Buttons */
    .cute-btn {
      background: linear-gradient(135deg, #ff1493, #ff69b4);
      color: #ffffff;
      border: none;
      padding: 16px 40px;
      font-size: 1.4rem;
      font-family: 'Fredoka', cursive, sans-serif;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 105, 180, 0.6);
      transition: all 0.3s ease;
      z-index: 10;
    }

    .cute-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 35px rgba(255, 20, 147, 0.9);
      background: linear-gradient(135deg, #ff69b4, #ff1493);
    }

    /* Button Fade Out Animation */
    #revealBtn.fade-out {
      opacity: 0;
      transform: scale(0.5);
      pointer-events: none;
      transition: opacity 1s ease, transform 1s ease;
    }

    /* Canvas for Heart Animation */
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    @media (max-width: 600px) {
      h1 { font-size: 2.2rem; }
      h2 { font-size: 1.3rem; }
      .cute-btn { font-size: 1.2rem; padding: 14px 30px; }
    }
  </style>
</head>
<body>

  <!-- PAGE 1 -->
  <div id="page1" class="page">
    <h1>HEYYY BABYYYY</h1>
    <h2>GOODDD MORNINGGG CUTIEE😁😘🥰😍😋💋</h2>
    <button class="cute-btn" onclick="goToNextPage()">Next 💕</button>
  </div>

  <!-- PAGE 2 -->
  <div id="page2" class="page hidden">
    <button id="revealBtn" class="cute-btn" onclick="startHeartReveal()">REVEAL ✨</button>
    <canvas id="heartCanvas"></canvas>
  </div>

  <script>
    // Navigation Logic
    function goToNextPage() {
      document.getElementById('page1').classList.add('hidden');
      document.getElementById('page2').classList.remove('hidden');
    }

    // Heart Canvas Setup
    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let pulseAngle = 0;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class HeartParticle {
      constructor(t, speed, fontSize, color) {
        this.t = t;
        this.speed = speed;
        this.fontSize = fontSize;
        this.color = color;
      }

      update() {
        this.t += this.speed;
        if (this.t > Math.PI * 2) {
          this.t -= Math.PI * 2;
        }
      }

      draw(cx, cy, scale, pulse) {
        const currentScale = scale * pulse;

        // Parametric Heart Equations
        const x = 16 * Math.pow(Math.sin(this.t), 3);
        const y = -(13 * Math.cos(this.t) - 5 * Math.cos(2 * this.t) - 2 * Math.cos(3 * this.t) - Math.cos(4 * this.t));

        const px = cx + x * currentScale;
        const py = cy + y * currentScale;

        ctx.save();
        ctx.font = `600 ${this.fontSize}px 'Fredoka', cursive, sans-serif`;
        ctx.fillStyle = this.color;
        ctx.shadowColor = '#ff1493';
        ctx.shadowBlur = 12;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        
        // Render text completely horizontal
        ctx.fillText("I love you", px, py);
        ctx.restore();
      }
    }

    function initHeartParticles() {
      particles = [];
      const totalParticles = 75; // Number of horizontal text items forming the heart shape
      const pinkShades = ['#ff69b4', '#ff1493', '#ff8da1', '#ffb6c1', '#ff007f'];

      for (let i = 0; i < totalParticles; i++) {
        const t = (i / totalParticles) * Math.PI * 2;
        const speed = 0.005; // Smooth, synchronized speed along the heart curve
        const fontSize = 15;
        const color = pinkShades[i % pinkShades.length];
        particles.push(new HeartParticle(t, speed, fontSize, color));
      }
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const cx = canvas.width / 2;
      const cy = canvas.height / 2 - 10;
      
      const scale = Math.min(canvas.width, canvas.height) / 38;

      pulseAngle += 0.03;
      const pulse = 1 + 0.03 * Math.sin(pulseAngle);

      particles.forEach(p => {
        p.update();
        p.draw(cx, cy, scale, pulse);
      });

      requestAnimationFrame(animate);
    }

    function startHeartReveal() {
      const btn = document.getElementById('revealBtn');
      btn.classList.add('fade-out');

      initHeartParticles();
      
      setTimeout(() => {
        animate();
      }, 300);
    }
  </script>
</body>
</html>
